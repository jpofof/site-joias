<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&amp;family=Jost:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Jost',sans-serif;background:#EFE2D2}
a{color:inherit;text-decoration:none}
a:hover{opacity:.78}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #EFE2D2; color: #32191D; font-family: 'Jost', sans-serif">

<div style="height: 64px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; background: #32191D">
<img src="/_blob/6bb43b6062b681b37447daf7366f11b6" alt="Eduáh Acessórios" style="height: 34px; display: block">
</div>
<div style="box-sizing: border-box; padding: 32px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="height: 32px; width: 220px; background: #D7C6B4"></div>
<div style="height: 220px; background: #D7C6B4"></div>
</div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: #32191D; opacity: 0.6"></div>

<nav aria-label="Menu principal" style="position: absolute; right: 0; top: 0; width: 320px; height: 844px; box-sizing: border-box; padding: 12px 24px 32px; display: flex; flex-direction: column; background: #EFE2D2">
<div style="display: flex; justify-content: flex-end; height: 48px; margin-bottom: 20px">
<a href="Mobile.dc.html" aria-label="Fechar menu" style="height: 48px; padding: 0 4px 0 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase">Fechar<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#32191D" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
</div>

<div style="font-size: 12px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #4E3B36; margin-bottom: 8px">Catálogo</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<a href="{{c.href}}" style="display: flex; align-items: center; justify-content: space-between; height: 52px; box-sizing: border-box; border-bottom: 1px solid #D7C6B4; font-family: 'Bodoni Moda', serif; font-size: 24px">{{c.name}}<span style="font-family: 'Jost', sans-serif; font-size: 16px">→</span></a>
</sc-for>
</div>
<a href="#todos" style="margin-top: 20px; display: flex; align-items: center; justify-content: center; height: 52px; box-sizing: border-box; background: #481E20; color: #EFE2D2; font-size: 13px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; border-radius: 2px">Ver catálogo</a>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 24px; border-top: 1px solid #B09D8F">
<a href="#sobre" style="display: flex; align-items: center; height: 48px; font-size: 14px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase">Sobre</a>
<a href="#carrinho" style="display: flex; align-items: center; justify-content: space-between; height: 48px; font-size: 14px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase">Carrinho <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; box-sizing: border-box; border: 1px solid #32191D; border-radius: 12px; font-size: 12px; letter-spacing: 0">0</span></a>
</div>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cats: [
        { name: 'Anéis', href: '#aneis' },
        { name: 'Brincos', href: '#brincos' },
        { name: 'Colares', href: '#colares' },
        { name: 'Pulseiras', href: '#pulseiras' },
        { name: 'Piercings', href: '#piercings' },
        { name: 'Linha masculina', href: '#masculina' }
      ]
    };
  }
}
</script>
</body>
</html>
