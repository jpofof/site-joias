<div style="width: 390px; height: 976px; box-sizing: border-box; display: flex; flex-direction: column; background: #EFE2D2; color: #32191D; font-family: 'Jost', sans-serif">

<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; background: #32191D">

<section style="box-sizing: border-box; padding: 32px 20px 0; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 34px; line-height: 1.1">Seu carrinho está vazio</h1>
<p style="margin: 0; font-size: 17px; font-weight: 300; line-height: 1.5; color: #4E3B36">Adicione produtos do catálogo para montar seu pedido. É simples:</p>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 20px; padding: 14px 20px; box-sizing: border-box; border: 1px solid #B09D8F">
<div style="font-family: 'Bodoni Moda', serif; font-size: 30px; line-height: 1; color: #481E20; width: 24px">{{s.n}}</div>
<div style="font-size: 17px">{{s.t}}</div>
</div>
</sc-for>
</div>
<a href="Catalogo.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; box-sizing: border-box; background: #481E20; color: #EFE2D2; font-size: 14px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 2px">Ver catálogo</a>
</section>

<section style="box-sizing: border-box; padding: 32px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4E3B36">Ou comece por uma categoria</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<a href="Catalogo.dc.html" style="display: flex; align-items: center; height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #32191D; font-size: 15px; border-radius: 2px">{{c}}</a>
</sc-for>
</div>
</section>

</div>
